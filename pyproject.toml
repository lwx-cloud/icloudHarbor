[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "icloudharbor"
version = "0.6.2"
description = "Reliable iCloud Photos backup and synchronization for Linux and NAS environments"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "iCloudHarbor contributors" }]
dependencies = [
  "APScheduler==3.11.0",
  "cryptography==49.0.0",
  "filelock==3.20.3",
  "httpx==0.28.1",
  "pyicloud==2.6.5",
  "pydantic==2.13.4",
  "PyYAML==6.0.2",
  "SQLAlchemy==2.0.41",
  "structlog==25.4.0",
  "typer==0.16.0",
  "pillow==12.3.0",
  "pillow-heif==1.1.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.0",
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
  "ruff==0.12.5",
]

[project.scripts]
icloudharbor = "icloudharbor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/icloudharbor"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["icloudharbor"]
