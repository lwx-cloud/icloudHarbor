services:
  icloudharbor:
    image: lwxcloud/icloudharbor:latest
    container_name: "${IH_CONTAINER_NAME:-icloudharbor}"
    restart: unless-stopped

    environment:
      - TZ=${IH_TIMEZONE:-UTC}
      - IH_TIMEZONE=${IH_TIMEZONE:-UTC}
      - IH_PUID=${IH_PUID:-1000}
      - IH_PGID=${IH_PGID:-1000}
      - IH_UMASK=${IH_UMASK:-0022}
      - IH_CONFIG_FILE=/config/config.yaml

      # 首次启动必填；其他参数按需从 CONFIGURATION.md 添加。
      - IH_APPLE_ID=${IH_APPLE_ID:-}
      - IH_REGION=${IH_REGION:-}
      - IH_DESTINATION=${IH_DESTINATION:-}
      - IH_SYNC_INTERVAL=${IH_SYNC_INTERVAL:-}
      - IH_RUN_ON_START=${IH_RUN_ON_START:-}

      # 可选企业微信应用通知；启用时前四项必须同时填写。
      - IH_WECOM_ID=${IH_WECOM_ID:-}
      - IH_WECOM_SECRET=${IH_WECOM_SECRET:-}
      - IH_WECOM_AGENT_ID=${IH_WECOM_AGENT_ID:-}
      - IH_WECOM_TO_USER=${IH_WECOM_TO_USER:-}
      - IH_WECOM_PROXY=${IH_WECOM_PROXY:-}
      - IH_WECOM_CONTENT_SOURCE_URL=${IH_WECOM_CONTENT_SOURCE_URL:-}
      - IH_WECOM_NAME=${IH_WECOM_NAME:-}
      - media_id_download=${MEDIA_ID_DOWNLOAD:-}
      - media_id_startup=${MEDIA_ID_STARTUP:-}
      - media_id_warning=${MEDIA_ID_WARNING:-}
      - media_id_expiration=${MEDIA_ID_EXPIRATION:-}
      - media_id_delete=${MEDIA_ID_DELETE:-}

    volumes:
      - "${IH_CONFIG_PATH:-./data/config}:/config"
      - "${IH_PHOTOS_PATH:-./data/photos}:/photos"
