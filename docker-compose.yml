services:
  icloudharbor:
    image: lwxcloud/icloudharbor:latest
    container_name: "${IH_CONTAINER_NAME:-icloudharbor}"
    restart: unless-stopped

    environment:
      TZ: "${IH_TIMEZONE:-UTC}"
      IH_TIMEZONE: "${IH_TIMEZONE:-UTC}"
      IH_PUID: "${IH_PUID:-1000}"
      IH_PGID: "${IH_PGID:-1000}"
      IH_UMASK: "${IH_UMASK:-0022}"
      IH_CONFIG_FILE: /config/config.yaml

      # 首次启动必填；其他参数按需从 CONFIGURATION.md 添加。
      IH_APPLE_ID: "${IH_APPLE_ID:-}"
      IH_REGION: "${IH_REGION:-}"
      IH_DESTINATION: "${IH_DESTINATION:-}"
      IH_SYNC_INTERVAL: "${IH_SYNC_INTERVAL:-}"
      IH_RUN_ON_START: "${IH_RUN_ON_START:-}"

    volumes:
      - "${IH_CONFIG_PATH:-./data/config}:/config"
      - "${IH_PHOTOS_PATH:-./data/photos}:/photos"
