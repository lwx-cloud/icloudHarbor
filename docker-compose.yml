services:
  icloudharbor:
    image: lwxcloud/icloudharbor:latest
    container_name: "${IH_CONTAINER_NAME:-icloudharbor}"
    restart: unless-stopped

    # `.env.example` 已列出新手常用项；高级能力见 CONFIGURATION.md。
    env_file:
      - .env
    # IH_AUTO_DELETE、IH_NOTIFY 等参数由上面的 .env 传入。

    environment:
      - TZ=${IH_TIMEZONE:-UTC}
      - IH_CONFIG_FILE=/config/config.yaml
      - IH_CONFIG_MODE=${IH_CONFIG_MODE:-env}

    volumes:
      - "${IH_CONFIG_PATH:-./data/config}:/config"
      - "${IH_PHOTOS_PATH:-./data/photos}:/photos"
