name: ci
run-name: CI · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - name: Validate Docker installer
        run: |
          bash -n deploy/install.sh
          bash deploy/install.sh --help >/dev/null
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/icloudharbor
      - name: Run local test suite when present
        if: hashFiles('tests/**/*.py') != ''
        run: uv run pytest --cov=icloudharbor --cov-report=term-missing

  docker:
    name: Docker validation
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
